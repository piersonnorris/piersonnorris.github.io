name: refresh-tracker

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save googleapis
      - run: node tools/tracker/build.js
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          TRACKER_PASSWORD: ${{ secrets.TRACKER_PASSWORD }}
          DIVIDEND_CALENDAR_JSON: ${{ secrets.DIVIDEND_CALENDAR_JSON }}
      - run: |
          git config user.name "tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/tracker/index.html
          git diff --cached --quiet || git commit -m "tracker: refresh"
          git push
