<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Illustration: a north star over the Chicago skyline and Lake Michigan">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset=".55" stop-color="#1c2f3f"/>
      <stop offset="1" stop-color="#3f5a4a"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a44"/>
      <stop offset="1" stop-color="#0d1a20"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".16" r=".35">
      <stop offset="0" stop-color="#8ED18A" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8ED18A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <rect width="400" height="600" fill="url(#glow)"/>
  <!-- stars -->
  <g fill="#e9edf3" opacity=".7">
    <circle cx="40" cy="60" r="1.2"/><circle cx="96" cy="120" r="1"/><circle cx="150" cy="40" r="1.4"/>
    <circle cx="210" cy="96" r="1"/><circle cx="60" cy="190" r="1"/><circle cx="340" cy="210" r="1.2"/>
    <circle cx="370" cy="50" r="1"/><circle cx="250" cy="170" r="1.1"/><circle cx="120" cy="240" r=".9"/>
  </g>
  <!-- the north star -->
  <g transform="translate(288 96)" fill="#8ED18A">
    <path d="M0-30 L5-5 L30 0 L5 5 L0 30 L-5 5 L-30 0 L-5-5Z"/>
    <circle r="3.5" fill="#f4fff2"/>
  </g>
  <!-- skyline -->
  <g fill="#0f1a22">
    <rect x="18" y="330" width="34" height="110"/>
    <rect x="56" y="300" width="26" height="140"/>
    <rect x="86" y="250" width="30" height="190"/>
    <path d="M122 440V214h14v-26h6v-30h2v30h6v26h14v226Z"/>
    <rect x="170" y="290" width="28" height="150"/>
    <rect x="202" y="236" width="36" height="204"/>
    <path d="M246 440V200l20-14 20 14v240Z"/>
    <rect x="292" y="280" width="30" height="160"/>
    <rect x="326" y="320" width="26" height="120"/>
    <rect x="356" y="296" width="30" height="144"/>
  </g>
  <g fill="#E8A33D" opacity=".55">
    <rect x="92" y="270" width="3" height="4"/><rect x="104" y="300" width="3" height="4"/>
    <rect x="208" y="260" width="3" height="4"/><rect x="224" y="310" width="3" height="4"/>
    <rect x="254" y="240" width="3" height="4"/><rect x="272" y="290" width="3" height="4"/>
    <rect x="298" y="320" width="3" height="4"/><rect x="176" y="330" width="3" height="4"/>
  </g>
  <!-- lake -->
  <rect y="440" width="400" height="160" fill="url(#lake)"/>
  <g stroke="#8ED18A" stroke-opacity=".25" stroke-width="1.5" stroke-linecap="round">
    <path d="M40 470h60M150 488h90M280 474h70M70 520h110M230 540h120M30 570h80"/>
  </g>
  <path d="M288 446v140" stroke="#8ED18A" stroke-opacity=".18" stroke-width="6"/>
</svg>
