<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Tracker — Pierson Norris</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;450;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root{
      --bg:#0e1116; --panel:#151b23; --line:#232d39; --line2:#2e3947;
      --ink:#e9edf3; --mut:#8b95a5; --dim:#5c6675;
      --acc:#5FAE5A; --acc-hi:#8ED18A; --bad:#e5534b;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
      font-size:16px;line-height:1.6;font-weight:450;min-height:100svh;padding:0 0 64px}
    ::selection{background:var(--acc);color:#0e1116}
    a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
    .wrap{max-width:880px;margin:0 auto;padding:0 20px}
    header{border-bottom:1px solid var(--line)}
    nav{display:flex;align-items:center;gap:22px;padding:16px 0;
      font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px}
    .brand{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:15px;color:var(--ink);text-decoration:none;margin-right:auto}
    nav a{color:var(--mut);text-decoration:none}
    nav a:hover{color:var(--acc)}
    nav a[aria-current="page"]{color:var(--acc);border-bottom:1px solid var(--acc);padding-bottom:2px}

    /* lock screen */
    #lock{display:grid;place-items:center;min-height:70svh;padding:40px 0}
    .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
      border-radius:16px;padding:36px 32px;text-align:center}
    .glyph{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.3em;
      color:var(--acc);border:1px solid var(--line2);border-radius:999px;display:inline-block;
      padding:6px 16px 6px 19px;margin-bottom:20px}
    .card h1{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:28px;
      letter-spacing:-.02em;margin:0 0 8px}
    .card p{color:var(--mut);font-size:14px;margin:0 0 24px;line-height:1.65}
    .pinrow{display:flex;gap:10px}
    #pin{flex:1;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--ink);
      font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:20px;letter-spacing:.4em;
      text-align:center;padding:12px 8px 12px 14px}
    #pin::placeholder{letter-spacing:.15em;font-size:13px;color:var(--dim)}
    #go{background:var(--acc);color:#0e1116;border:0;border-radius:10px;cursor:pointer;
      font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:14px;font-weight:500;padding:12px 20px}
    #go:hover{background:var(--acc-hi)}
    #go:disabled{opacity:.55;cursor:wait}
    #msg{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;min-height:20px;margin:14px 0 0;color:var(--dim)}
    #msg.err{color:var(--bad)}
    .shake{animation:shake .35s}
    @keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
    @media (prefers-reduced-motion: reduce){.shake{animation:none}}
    .finelock{margin-top:22px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11.5px;color:var(--dim);line-height:1.7}

    /* unlocked content */
    #vault{display:none}
    .bar{display:flex;align-items:center;gap:14px;margin:32px 0 20px}
    .bar h1{font-family:'Archivo',system-ui,sans-serif;font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;margin:0}
    #relock{margin-left:auto;background:var(--panel);color:var(--mut);border:1px solid var(--line2);
      border-radius:8px;cursor:pointer;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;padding:8px 14px}
    #relock:hover{color:var(--acc);border-color:var(--acc)}
    .meta{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:var(--dim);margin:0 0 22px}
    .meta b{color:var(--mut);font-weight:500}
    .platform{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px 8px;margin:0 0 18px}
    .platform h2{font-family:'Archivo',system-ui,sans-serif;font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0 0 4px;display:flex;align-items:center;gap:9px}
    .pdot{width:9px;height:9px;border-radius:50%;flex:none}
    .pcount{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:var(--dim);font-weight:400;margin-left:auto}
    .tscroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500;text-align:left;padding:10px 10px 8px;border-bottom:1px solid var(--line2)}
    td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
    tr:last-child td{border-bottom:0}
    td.label{font-weight:600;white-space:nowrap}
    td.amt{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    td.unit{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12.5px;color:var(--dim);white-space:nowrap}
    td.notes{color:var(--mut);font-size:13.5px;min-width:180px}
    th.r{text-align:right}
  </style>
</head>
<body>
  <header><div class="wrap"><nav>
    <a class="brand" href="/">Pierson Norris</a>
    <a href="/">Home</a>
    <a href="/experience/">Experience</a>
    <a href="/tools/tracker/" aria-current="page">Tracker</a>
  </nav></div></header>

  <div class="wrap">
    <section id="lock">
      <form class="card" id="lockcard">
        <span class="glyph">ENCRYPTED</span>
        <h1>Portfolio Tracker</h1>
        <p>Holdings are sealed into this page with AES-256 encryption. Enter the PIN to unlock — decryption happens in your browser, nothing is sent anywhere.</p>
        <div class="pinrow">
          <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
          <button id="go" type="submit">Unlock</button>
        </div>
        <p id="msg" aria-live="polite"></p>
        <p class="finelock">No cookies · no storage · locks again when the tab closes</p>
      </form>
    </section>

    <section id="vault">
      <div class="bar"><h1>Portfolio Tracker</h1><button id="relock" type="button">Lock</button></div>
      <div id="content"></div>
    </section>
  </div>

    function b64(s){var bin=atob(s),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}

    var form=document.getElementById('lockcard'), pinEl=document.getElementById('pin'),
        go=document.getElementById('go'), msg=document.getElementById('msg');

    async function unlock(pin){
      var enc=new TextEncoder();
      var base=await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
      var key=await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'},
        base, {name:'AES-GCM', length:256}, false, ['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
      return new TextDecoder().decode(pt);
    }

    form.addEventListener('submit', function(e){
      e.preventDefault();
      var pin=pinEl.value.trim();
      if(!pin){pinEl.focus();return;}
      go.disabled=true; msg.className=''; msg.textContent='verifying…';
      unlock(pin).then(function(html){
        document.getElementById('content').innerHTML=html;
        document.getElementById('lock').style.display='none';
        document.getElementById('vault').style.display='block';
        pinEl.value='';
        go.disabled=false; msg.textContent='';
      }).catch(function(){
        go.disabled=false; msg.className='err'; msg.textContent='Wrong PIN.';
        pinEl.value=''; pinEl.focus();
        form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      });
    });

    document.getElementById('relock').addEventListener('click', function(){
      document.getElementById('content').innerHTML='';
      document.getElementById('vault').style.display='none';
      document.getElementById('lock').style.display='grid';
      pinEl.focus();
    });
  </script>
